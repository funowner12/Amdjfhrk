<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Owner Pro Panel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 30px auto;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 {
      text-align: center;
      font-size: 2.8rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00ffff, #8a2be2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { text-align: center; opacity: 0.8; margin-bottom: 30px; font-size: 1.1rem; }

    .section {
      background: rgba(255,255,255,0.07);
      padding: 28px;
      border-radius: 18px;
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .section h2 {
      font-size: 1.7rem;
      margin-bottom: 25px;
      text-align: center;
      color: #00ffff;
    }

    label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 1.1rem; }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1.1rem;
      transition: 0.3s;
    }
    input::placeholder { color: rgba(255,255,255,0.6); }
    input:focus { outline: none; background: rgba(255,255,255,0.25); transform: scale(1.02); }

    .btn-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 30px 0;
    }
    button {
      padding: 15px 32px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.1rem;
    }
    .btn-save { background: #00ff88; color: #000; }
    .btn-reload { background: #8b5cf6; }
    .btn-delete { background: #ff3b30; }
    .btn-add { background: #00d4ff; color: #000; font-weight: bold; }
    button:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }

    .add-user { text-align: center; margin-bottom: 25px; }
    .add-user input {
      width: 380px;
      display: inline-block;
      text-align: center;
      font-size: 1.2rem;
    }
    .total {
      text-align: center;
      font-size: 1.5rem;
      padding: 18px;
      background: rgba(0,255,255,0.15);
      border-radius: 14px;
      margin: 20px 0;
      font-weight: bold;
    }
    .user-list {
      display: grid;
      gap: 14px;
      max-height: 500px;
      overflow-y: auto;
      padding: 10px;
    }
    .user-card {
      background: rgba(255,255,255,0.12);
      padding: 18px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 5px solid #00ffff;
    }
    .user-card h3 { font-size: 1.4rem; }
    .user-card p { opacity: 0.9; font-size: 0.95rem; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 32px;
      background: #00ff88;
      color: #000;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 9999;
      opacity: 0;
      transition: all 0.4s ease;
    }
    .toast.show { opacity: 1; bottom: 40px; }
    .toast.error { background: #ff3b30; color: white; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Owner Pro Panel</h1>
    <p class="subtitle">Secret Admin • Add Any 3–15 Digit ID • Full Hidden Control</p>

    <!-- Config Editor -->
    <div class="section">
      <h2>App Config</h2>
      <div><label>Link</label><input type="text" id="link" placeholder="Enter link"></div>
      <div><label>URL</label><input type="text" id="url" placeholder="Main URL"></div>
      <div><label>Recharge Link</label><input type="text" id="rechargelink" placeholder="Recharge page"></div>
      <div><label>Title Name</label><input type="text" id="titlename" placeholder="App name"></div>

      <div class="btn-group">
        <button class="btn-save" id="save">Save Config</button>
        <button class="btn-reload" id="reload">Reload</button>
        <button class="btn-delete" id="deleteAll">Delete All</button>
      </div>
    </div>

    <!-- Users / ID Management -->
    <div class="section">
      <h2>Owner IDs (3–15 Digits)</h2>
      <div class="add-user">
        <input type="text" id="idInput" placeholder="Enter 3 to 15 digit ID" maxlength="15" inputmode="numeric">
        <br><br>
        <button class="btn-add" id="addBtn">Add as Owner</button>
      </div>
      <div class="total">Total Owners: <b id="totalCount">0</b></div>
      <div id="usersList" class="user-list"></div>
    </div>
  </div>

  <div id="toast" class="toast">Saved!</div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    firebase.initializeApp({ databaseURL: "https://newproba-default-rtdb.firebaseio.com" });
    const db = firebase.database();
    const configRef = db.ref("data/data");
    const usersRef = db.ref("Users");

    const toast = document.getElementById("toast");
    const usersList = document.getElementById("usersList");
    const totalCount = document.getElementById("totalCount");

    function show(msg, error = false) {
      toast.textContent = msg;
      toast.classList.toggle("error", error);
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function getTime() {
      const d = new Date();
      return `\( {String(d.getDate()).padStart(2,'0')}/ \){String(d.getMonth()+1).padStart(2,'0')}/\( {d.getFullYear()} \){d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // Load Config Silently
    function load() {
      configRef.once("value").then(s => {
        const d = s.val() || {};
        document.getElementById("link").value = d.link || "";
        document.getElementById("url").value = d.url || "";
        document.getElementById("rechargelink").value = d.rechargelink || "";
        document.getElementById("titlename").value = d.titlename || "";
      });
    }

    // Save Config
    document.getElementById("save").onclick = () => {
      const data = {
        link: document.getElementById("link").value.trim(),
        url: document.getElementById("url").value.trim(),
        rechargelink: document.getElementById("rechargelink").value.trim(),
        titlename: document.getElementById("titlename").value.trim()
      };
      configRef.set(data).then(() => show("Config Saved"));
    };

    document.getElementById("reload").onclick = load;

    document.getElementById("deleteAll").onclick = () => {
      if (confirm("Delete all config?")) {
        configRef.remove().then(() => {
          document.querySelectorAll("input[type=text]").forEach(i => i.value = "");
          show("Config Deleted");
        });
      }
    };

    // Add Owner ID (3 to 15 digits)
    document.getElementById("addBtn").onclick = () => {
      let input = document.getElementById("idInput").value.trim();
      
      // Remove any non-digit characters
      const id = input.replace(/\D/g, '');
      
      if (id.length < 3 || id.length > 15) {
        return show("Enter 3 to 15 digits only!", true);
      }

      usersRef.child(id).set({
        mobile: id,
        brand: "owner",
        time: getTime()
      }).then(() => {
        show(`${id} → Added as Owner`);
        document.getElementById("idInput").value = "";
      }).catch(() => show("Failed!", true));
    };

    // Delete User
    function del(id) {
      if (confirm(`Delete ${id} permanently?`)) {
        usersRef.child(id).remove().then(() => show(`${id} Deleted`));
      }
    }

    // Live List
    usersRef.on("value", s => {
      usersList.innerHTML = "";
      const users = s.val() || {};
      totalCount.textContent = Object.keys(users).length;

      Object.keys(users).sort().forEach(id => {
        const u = users[id];
        const div = document.createElement("div");
        div.className = "user-card";
        div.innerHTML = `
          <div>
            <h3>${id}</h3>
            <p>Owner • Added: ${u.time}</p>
          </div>
          <button class="btn-delete" onclick="del('${id}')">Delete</button>
        `;
        usersList.appendChild(div);
      });
    });

    load();
  </script>
</body>
</html>
